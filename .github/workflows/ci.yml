# Loyalty test automation CI
#
# Triggers:
#   - Push or PR to main/master
#   - Manual run: GitHub → Actions → CI → Run workflow
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   BASE_URL    — Loyalty app URL (QA)
#   SIGNUP_OTP  — OTP code for completeprofile scenario
#
# After a run: open the job → Summary tab for pass/fail table with @TC-* links.
# Download artifacts for Allure HTML, traces, and screenshots.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

  cucumber-loyalty:
    name: Cucumber (${{ matrix.browser }})
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Reset Allure folders
        run: npm run allure:clean

      - name: Cucumber smoke (welcome + completeprofile)
        id: cucumber
        continue-on-error: true
        env:
          CI: true
          HEADLESS: 'true'
          TEST_ENV: qa
          BROWSER: ${{ matrix.browser }}
          PARALLEL_WORKERS: '1'
          CUCUMBER_RETRY: '1'
          BASE_URL: ${{ secrets.BASE_URL }}
          SIGNUP_OTP: ${{ secrets.SIGNUP_OTP }}
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
        run: npx cucumber-js --profile smoke

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
        continue-on-error: true

      - name: Generate traceability matrix
        if: ${{ !cancelled() }}
        env:
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
        run: npm run traceability:generate
        continue-on-error: true

      - name: GitHub Job Summary (TC linkage)
        if: ${{ !cancelled() }}
        env:
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
        run: npm run ci:summary

      - name: Upload Allure + failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.browser }}-artifacts
          path: |
            reports/allure-results/
            reports/allure-report/
            reports/cucumber.json
            reports/traces/
            reports/screenshots/
            reports/logs/
            docs/traceability-matrix.md
          retention-days: 14

      - name: Fail job if Cucumber failed
        if: steps.cucumber.outcome == 'failure'
        run: exit 1
