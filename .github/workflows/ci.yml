# Loyalty test automation CI
#
# Triggers:
#   - Push or PR to main/master
#   - Manual run: GitHub → Actions → CI → Run workflow
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   BASE_URL                  — Loyalty app URL (QA); falls back to env.qa.ts when unset
#   SIGNUP_OTP                — OTP code for completeprofile scenario
#   VERCEL_PROTECTION_BYPASS  — Vercel deployment protection bypass secret (required if QA shows "We're verifying your browser")
#
# One-time GitHub Pages setup (for browsable Allure report):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# After a run:
#   - Playwright UI job → Summary tab: pass/fail table, failure details
#   - Artifacts: download playwright-ui-artifacts
#   - publish-allure job → Summary tab: GitHub Pages URL for Allure HTML

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

  playwright-ui:
    name: Playwright UI
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Reset Allure folders
        run: npm run allure:clean

      - name: Check required secrets (presence only)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SIGNUP_OTP: ${{ secrets.SIGNUP_OTP }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          {
            echo "## Secret presence (values not printed)"
            echo ""
            echo "- BASE_URL: $( [ -n \"$BASE_URL\" ] && echo set || echo MISSING )"
            echo "- SIGNUP_OTP: $( [ -n \"$SIGNUP_OTP\" ] && echo set || echo MISSING )"
            echo "- VERCEL_PROTECTION_BYPASS: $( [ -n \"$VERCEL_PROTECTION_BYPASS\" ] && echo set || echo MISSING )"
            echo ""
            if [ -z "$VERCEL_PROTECTION_BYPASS" ]; then
              echo "**Warning:** without VERCEL_PROTECTION_BYPASS, headless CI often hits Vercel \"We're verifying your browser\" and fails."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright UI (--project=ui; api project skipped until tests/api is populated)
        id: playwright
        continue-on-error: true
        env:
          CI: true
          HEADLESS: 'true'
          TEST_ENV: qa
          BROWSER: chromium
          PARALLEL_WORKERS: '1'
          BASE_URL: ${{ secrets.BASE_URL }}
          SIGNUP_OTP: ${{ secrets.SIGNUP_OTP }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
        run: |
          set -o pipefail
          {
            echo "### Playwright --list"
            npx playwright test --project=ui --list || true
            echo ""
            echo "### Playwright run"
            npx playwright test --project=ui --retries=1
          } 2>&1 | tee playwright-ci.log
          status=${PIPESTATUS[0]}
          {
            echo "## Playwright console (tail)"
            echo ""
            echo '```'
            tail -n 80 playwright-ci.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Surface Playwright last-run into Job Summary
        if: always()
        run: |
          {
            echo "## Playwright last-run"
            echo ""
            if [ -f test-results/.last-run.json ]; then
              echo '```json'
              cat test-results/.last-run.json
              echo '```'
            else
              echo "_No test-results/.last-run.json (Playwright may have failed before writing results)._"
            fi
            echo ""
            echo "### Spec files present"
            echo ""
            ls -la tests/ui || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
        continue-on-error: true

      - name: Generate traceability matrix
        if: always()
        env:
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
        run: npm run traceability:generate
        continue-on-error: true

      - name: GitHub Job Summary (TC linkage + failures)
        if: always()
        env:
          ALLURE_TMS_URL: https://github.com/${{ github.repository }}/issues/
          BROWSER: chromium
        run: npm run ci:summary

      - name: Upload Allure + failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-artifacts
          path: |
            reports/allure-results/
            reports/allure-report/
            reports/traces/
            reports/screenshots/
            reports/logs/
            docs/traceability-matrix.md
            test-results/
            playwright-ci.log
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  publish-allure:
    name: Publish Allure (GitHub Pages)
    needs: playwright-ui
    # Artifact upload above is the primary publish path. Pages is best-effort when enabled.
    if: always() && needs.playwright-ui.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Playwright UI Allure report
        uses: actions/download-artifact@v4
        with:
          name: playwright-ui-artifacts
          path: artifact

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Allure site
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/reports/allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Allure report URL
        if: always()
        run: |
          {
            echo "## Allure report publish"
            echo ""
            if [ "${{ steps.deploy.outcome }}" = "success" ] && [ -n "${{ steps.deploy.outputs.page_url }}" ]; then
              echo "Browse the latest Allure HTML report:"
              echo ""
              echo "**${{ steps.deploy.outputs.page_url }}**"
              echo ""
              echo "Includes pass/fail, step attachments, failure screenshots, and downloadable Playwright trace zips."
            else
              echo "GitHub Pages publish skipped or failed (Pages may not be enabled for this repo)."
              echo "Download the **playwright-ui-artifacts** artifact and open \`reports/allure-report/index.html\`."
              echo ""
              echo "To enable Pages: Settings → Pages → Build and deployment → Source: **GitHub Actions**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
